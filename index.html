
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - السلسبيل</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #e8f3ed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px #00000015;
        }

        h1 {
            color: #176b4d;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: right;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #176b4d;
        }

        button {
            width: 100%;
            background: #176b4d;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 17px;
            margin-top: 22px;
            cursor: pointer;
        }

        button:hover {
            background: #10543e;
        }

        #message {
            color: #b42318;
            margin-top: 15px;
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>السلسبيل</h1>

        <p class="description">
            منصة تحفيظ القرآن الكريم
        </p>

        <form id="loginForm">

            <label for="username">اسم المستخدم</label>
            <input
                type="text"
                id="username"
                placeholder="أدخلي اسم المستخدم"
                required
            >

            <label for="password">كلمة المرور</label>
            <input
                type="password"
                id="password"
                placeholder="أدخلي كلمة المرور"
                required
            >

            <button type="submit">تسجيل الدخول</button>

            <p id="message"></p>

        </form>

        <div class="footer">
            © السلسبيل لتحفيظ القرآن الكريم
        </div>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                if (username === "student" &&
                    password === "1234") {

                    window.location.href = "about.html";

                } else {

                    document.getElementById("message").textContent =
                        "اسم المستخدم أو كلمة المرور غير صحيحة.";
                }
            });
    </script>

</body>
</html>
