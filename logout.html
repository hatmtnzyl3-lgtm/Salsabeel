
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  
<link rel="stylesheet" href="style.css">


    <title>تسجيل الخروج - السلسبيل</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #e8f3ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: white;
            max-width: 450px;
            width: 100%;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px #00000015;
        }

        h1 {
            color: #176b4d;
        }

        p {
            line-height: 1.9;
            color: #555;
        }

        a {
            display: inline-block;
            background: #176b4d;
            color: white;
            text-decoration: none;
            padding: 13px 24px;
            margin-top: 15px;
            border-radius: 8px;
        }

        a:hover {
            background: #10543e;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>السلسبيل</h1>

        <h2>تم تسجيل الخروج</h2>

        <p>
            شكرًا لزيارتك منصة السلسبيل.
            نسأل الله أن يجعل القرآن الكريم نورًا لحياتك.
        </p>
